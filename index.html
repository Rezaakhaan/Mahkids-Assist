:root{--bg:#f6f5f1;--card:#fff;--text:#1d2320;--muted:#6b746f;--accent:#0f7b5f;--soft:#e1f2ec;--border:#e2e0d8;--warn:#b3402a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.seg{display:flex;margin-top:10px}

.sr{display:grid;grid-template-columns:1fr 1fr .8fr 40px;gap:8px;margin-bottom:6px;align-items:center}

.big{font-size:38px;font-weight:800;color:var(--accent);line-height:1.3;direction:ltr}

.hd{display:flex;justify-content:space-between;align-items:center}
.t{display:flex;justify-content:space-between;font-weight:700;gap:8px}

.brand{display:flex;align-items:center;gap:10px}

.card h2{margin-bottom:6px}

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var APP_VER=15;   // تنها جای شمارهٔ نسخه؛ نمایش در تنظیمات و نسخهٔ سرویس‌ورکر از همین می‌آید
var nf=new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
var F=function(n){var v=Math.round(n);if(!isFinite(v))return '0';if(v===0)v=0;return nf.format(v)};
var MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
var ld0=true,items=[],log=[],S={},rows=[{s:'',c:'',q:''}],editId=null,mode='unit',openSell=null,showRep=false,delArm=null,undoArm=null,qry='',flt='all',sv='r',sq='',xp=[],curImg='',curBig=null,qsel=null,qty={},rg='m',retArm=null,CU={},cdet=null;
// ---- IndexedDB photo store (v7) ----
var idb=null,idbReady=false,phSaved={},phBusy=false,phAgain=false;
function stripImg(it){if(it&&it.img&&phSaved[String(it.id)]===it.img){var c={};for(var k in it)if(k!=='img')c[k]=it[k];return c}return it}
function persist2(){try{localStorage.setItem('fc2_items',JSON.stringify(items.map(stripImg)))}catch(e){}}
function idbOpen(cb){try{var r=indexedDB.open('mahkids',1);r.onupgradeneeded=function(){var d=r.result;if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos')};r.onsuccess=function(){idb=r.result;cb(true)};r.onerror=function(){cb(false)};r.onblocked=function(){cb(false)}}catch(e){cb(false)}}
function idbSync(){
  if(!idb||!idbReady)return;
  if(phBusy){phAgain=true;return}
  var todo=items.filter(function(x){return x.img&&phSaved[String(x.id)]!==x.img}),ids={},del=[];
  items.forEach(function(x){ids[String(x.id)]=1;if(!x.img&&phSaved[String(x.id)]!==undefined)del.push(String(x.id))});
  if(items.length)Object.keys(phSaved).forEach(function(k){if(!ids[k]&&del.indexOf(k)<0)del.push(k)});
  if(!todo.length&&!del.length)return;
  phBusy=true;
  try{
    var tx=idb.transaction('photos','readwrite'),st=tx.objectStore('photos');
    todo.forEach(function(x){st.put(x.img,String(x.id))});
    del.forEach(function(k){st.delete(k)});
    tx.oncomplete=function(){
      todo.forEach(function(x){phSaved[String(x.id)]=x.img});
      del.forEach(function(k){delete phSaved[k]});
      phBusy=false;
      if(todo.length)persist2();
      if(phAgain){phAgain=false;idbSync()}
    };
    tx.onerror=tx.onabort=function(){phBusy=false};
  }catch(e){phBusy=false}
}
function idbLoad(){
  idbOpen(function(ok){
    if(!ok){ld0=false;render();return}
    try{
      var tx=idb.transaction('photos','readonly'),rq=tx.objectStore('photos').openCursor(),got={};
      rq.onsuccess=function(){var c=rq.result;if(c){got[String(c.key)]=c.value;c.continue()}};
      tx.oncomplete=function(){
        items.forEach(function(x){var k=String(x.id);if(!x.img&&got[k])x.img=got[k]});
        Object.keys(got).forEach(function(k){phSaved[k]=got[k]});
        idbReady=true;ld0=false;render();idbSync();
      };
      tx.onerror=tx.onabort=function(){};
    }catch(e){}
  });
}
function phInfo(){var e=$('bc');if(!e)return;var n=items.filter(function(x){return x.img}).length;e.textContent+=' \u2022 '+n+' \u0639\u06a9\u0633'}


function ld(k,d){try{var v=JSON.parse(localStorage.getItem(k)||'null');return v==null?d:v}catch(e){return d}}
function hap(){try{if(navigator.vibrate)navigator.vibrate(14)}catch(e){}}
function toast(m,bad,act){var e=$('toast');e.innerHTML='<span class="tt">'+esc(m)+'</span>'+(act?'<button type="button" class="ta" id="tact">'+esc(act.t)+'</button>':'');e.className='show'+(bad?' bad':'');
  if(act)$('tact').onclick=function(){e.className='';clearTimeout(toast.t);act.f()};
  clearTimeout(toast.t);toast.t=setTimeout(function(){e.className=''},bad?6000:(act?5000:2200))}
function persist(){try{idbSync();localStorage.setItem('fc2_items',JSON.stringify(items.map(stripImg)));localStorage.setItem('fc2_log',JSON.stringify(log));localStorage.setItem('fc2_exp',JSON.stringify(xp));localStorage.setItem('fc2_cust',JSON.stringify(CU));return true}catch(e){toast('ذخیره نشد! حافظه مرورگر پر یا غیرفعال است. همین حالا پشتیبان بگیر.',1);return false}}
function lat(s){return String(s==null?'':s).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)}).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/٫/g,'.').replace(/٬/g,',')}
function num(s){
  s=String(s||'').replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)})
   .replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)})
   .replace(/[٫]/g,'.').replace(/[,٬،\s]/g,'');
  return s===''?NaN:Number(s);
}
function nz(s){return lat(s).replace(/ي/g,'ی').replace(/ك/g,'ک').toLowerCase().trim()}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return ('0'+n).slice(-2)}
function uid(){return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
// ---- جداکنندهٔ سه‌رقمی هنگام تایپ + نوشتن مبلغ با حروف ----
function pw(n){n=Math.floor(n);if(!(n>0)||n>=1e15)return '';var u=[[1e9,'میلیارد'],[1e6,'میلیون'],[1e3,'هزار']],p=[];u.forEach(function(x){var q=Math.floor(n/x[0]);if(q>0){p.push(nf.format(q)+' '+x[1]);n-=q*x[0]}});if(n>0)p.push(String(n));return p.join(' و ')+' تومان'}
function fm(el){
  var raw=lat(el.value),pos=el.selectionStart;if(pos==null||pos>raw.length)pos=raw.length;
  var keep=raw.slice(0,pos).replace(/[^0-9.]/g,'').length,t=raw.replace(/[^0-9.]/g,''),i=t.indexOf('.'),ip=i<0?t:t.slice(0,i),fp=i<0?'':'.'+t.slice(i+1).replace(/\./g,'');
  ip=ip.replace(/^0+(?=\d)/,'');if(ip===''&&fp){ip='0';if(keep>0)keep++}ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g,',');
  var out=ip+fp;
  if(out!==el.value){el.value=out;var c=0,j=0;if(keep>0){for(;j<out.length;j++){if(/[0-9.]/.test(out.charAt(j))){c++;if(c===keep){j++;break}}}}else j=0;try{el.setSelectionRange(j,j)}catch(e){}}
  var w=$(el.id+'w');if(w){var v=num(out);w.textContent=v>=1000?pw(v):''}
}
document.addEventListener('input',function(e){var t=e.target;if(t&&t.classList&&t.classList.contains('m'))fm(t)},true);
// ---- مشتری با شمارهٔ تلفن شناخته می‌شود ----
function pnorm(s){var d=lat(s).replace(/\D/g,'');if(d.indexOf('0098')===0)d='0'+d.slice(4);else if(d.indexOf('98')===0&&d.length===12)d='0'+d.slice(2);else if(d.length===10&&d.charAt(0)==='9')d='0'+d;return d}
function ckey(e){var p=pnorm(e.ph||'');if(p)return p;var n=nz(e.cu||'');return n?'n:'+n:''}
function shipOf(it){var q=0;it.sizes.forEach(function(z){q+=z.q});q=q||1;return (it.ship||0)/q}
function shSplit(e){var x=e.x||0;if(!x)return [0,0];if(e.sh!=null){var h=Math.min(e.sh,x);return [h,x-h]}
  var it=items.filter(function(i){return i.id===e.iid})[0];if(it){var s=shipOf(it),t=extraOf(it);if(t>0){var h2=x*s/t;return [h2,x-h2]}}return [0,x]}
// تبدیل مشتریان قدیمی (کلید = نام) به کلید = تلفن
function mc(O){var P={};
  log.forEach(function(e){if(e.ph)e.ph=pnorm(e.ph)});
  log.forEach(function(e){var n=nz(e.cu||'');if(n&&e.ph){(P[n]=P[n]||{})[e.ph]=1}});
  Object.keys(O).forEach(function(k){var p=pnorm((O[k]||{}).ph||'');if(p){(P[k]=P[k]||{})[p]=1}});
  var one=function(n){var a=Object.keys(P[n]||{});return a.length===1?a[0]:''};
  log.forEach(function(e){var n=nz(e.cu||'');if(n&&!e.ph){var p=one(n);if(p)e.ph=p}});
  Object.keys(O).forEach(function(k){var c=O[k]||{},nk=one(k)||'n:'+k,t=CU[nk]||(CU[nk]={});if(c.nt&&!t.nt)t.nt=c.nt})}

function valid(x){return x&&x.id&&x.name&&Array.isArray(x.sizes)}
function numE(e){if(!e)return e;if(e.rn!=null){e.rn=+e.rn;if(!isFinite(e.rn)||e.rn<0)e.rn=0}
